<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice · Vendor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2F7A5A; --green-600:#256649; --green-50:#EAF4EF; --green-100:#D3E8DD;
    --text:#1D1D22; --muted:#6E6E7A; --faint:#9A9AA6;
    --border:#E4E6E8; --head:#F1F2F4; --row-alt:#F8F9FA; --page:#F9FAF9; --bg:#FFFFFF;
    --amber-bg:#FCF5E3; --amber-border:#EFD9A0; --amber:#8A6100;
    --blue:#2563EB; --blue-bg:#EAF1FE; --red:#D64545; --red-bg:#FDECEC; --slate-bg:#EEF0F3;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:12px;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:12px;color:var(--text)}
  a{color:inherit}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh}
  .rail{width:34px;flex:none;border-right:1px solid var(--border);background:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0;position:sticky;top:0;height:100vh}
  .rail button{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:#fff;display:grid;place-items:center;color:var(--muted);padding:0}
  .rail button:hover{color:var(--green);border-color:var(--green)}
  .rail .home{background:var(--green-50);color:var(--green);border-color:var(--green-100)}
  .rail .org{width:26px;height:26px;background:var(--green);color:#fff;border:none;font-size:8px;font-weight:700}
  .rail .org-lbl{font-size:6px;color:var(--muted);margin-top:-12px}
  .side{width:150px;flex:none;border-right:1px solid var(--border);background:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 10px 40px}
  .logo{margin:0 auto 18px;width:128px;text-align:center}
  .logo img{display:block;width:100%;height:auto}
  .logo-top{font-size:7.5px;font-weight:700;letter-spacing:.3px;color:#B4122B}
  .logo-mark{height:44px;margin-top:2px;background:conic-gradient(from 200deg,#E8541E,#F6A21E,#C8102E,#7A1F4B,#E8541E);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.95}
  .logo-name{background:#1F3F8F;color:#fff;font-size:7px;font-weight:600;letter-spacing:.6px;padding:3px 0}
  .acct{margin:0 0 6px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--row-alt)}
  .acct label{display:block;font-size:8.5px;color:var(--faint);margin-bottom:4px}
  .acct select{width:100%;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:9.5px;font-weight:600;padding:5px 4px;color:var(--text)}
  .nav-sec{font-size:8.5px;color:var(--faint);padding:12px 8px 4px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:5px;color:#44444C;font-size:10.5px;cursor:pointer;user-select:none;line-height:1.25}
  .nav-item:hover{background:var(--row-alt)}
  .nav-item svg{flex:none;color:#7A7A85}
  .nav-item.active{background:var(--green);color:#fff;font-weight:600}
  .nav-item.active svg{color:#fff}
  .badge{margin-left:auto;min-width:15px;height:15px;border-radius:8px;background:#F4C542;color:#4A3800;font-size:8.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  .main{flex:1;min-width:0;padding:26px 32px 80px}
  .content{max-width:1080px;margin:0 auto}

  /* ---------- Common ---------- */
  .crumb{font-size:11px;font-weight:600}
  h1{font-size:22px;font-weight:600;margin:4px 0 14px;letter-spacing:-.2px}
  .tabs{display:flex;gap:8px;margin-bottom:22px}
  .tab{border:1px solid var(--green);background:#fff;color:var(--text);border-radius:5px;padding:5px 11px;font-size:10.5px;font-weight:600}
  .tab.on{background:var(--green);color:#fff}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--green);background:#fff;color:var(--text);border-radius:6px;padding:6px 12px;font-size:10.5px;font-weight:600}
  .btn:hover{background:var(--green-50)}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-600)}
  .btn-ghost{border-color:var(--border)}
  .link{color:var(--blue);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-size:inherit}
  .po-link{font-weight:700;text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-size:inherit;color:var(--text)}
  .po-link:hover{color:var(--green)}
  .chip{display:inline-block;border-radius:10px;padding:2px 8px;font-size:10px;font-weight:600;white-space:nowrap}
  .st-ACK{background:var(--amber-bg);color:var(--amber)}
  .st-OPEN{background:var(--green-50);color:var(--green-600)}
  .st-INV{background:var(--blue-bg);color:var(--blue)}
  .st-CLOSED{background:var(--slate-bg);color:#4B5563}
  .st-CANCELLED{background:var(--red-bg);color:var(--red)}
  .muted{color:var(--muted)} .faint{color:var(--faint)} .right{text-align:right} .center{text-align:center}

  /* ---------- List ---------- */
  .count{font-size:10.5px;font-weight:600;margin-bottom:14px}
  .lbl{font-size:9.5px;font-weight:600;margin-bottom:6px;text-transform:none}
  .filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .pill{border:none;background:none;color:var(--muted);font-size:10px;padding:4px 9px;border-radius:5px}
  .pill.on{background:var(--green);color:#fff;font-weight:600}
  .date-in{border:1.5px solid var(--green);border-radius:3px;padding:7px 8px;font-size:10.5px;font-weight:600;color:var(--green-600);background:#fff;margin-left:14px;width:130px}
  .date-in + .date-in{margin-left:4px}
  .search{width:100%;background:#F1F2F3;border:1px solid var(--border);border-radius:3px;padding:9px 10px;font-size:11px;margin-bottom:16px}
  .search:focus,.date-in:focus{outline:2px solid var(--green-100)}
  .status-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
  .status-btn{border:1px solid var(--border);background:#fff;border-radius:3px;padding:5px 8px;font-size:10px;color:#33333B}
  .status-btn.on{border-color:var(--green);background:var(--green-50);color:var(--green-600);font-weight:600}
  .table-wrap{background:#fff;border:1px solid var(--border);border-radius:3px;overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  .list th{font-size:10.5px;font-weight:600;text-align:left;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
  .list td{padding:11px 10px;border-bottom:1px solid var(--border);font-size:11px;white-space:nowrap}
  .list tr:last-child td{border-bottom:none}
  .list tbody tr:hover td{background:var(--row-alt)}
  .sort{cursor:pointer;user-select:none}
  .sort .ar{display:inline-block;margin-left:3px;font-size:8px;color:var(--faint)}
  .sort.on .ar{color:var(--text)}
  .empty{padding:36px;text-align:center;color:var(--muted)}

  /* ---------- Detail ---------- */
  .back{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
  .back button{width:18px;height:18px;border-radius:50%;border:none;background:var(--text);color:#fff;display:grid;place-items:center;padding:0}
  .back h2{font-size:16px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:-.1px}
  .banner{border:1px solid var(--amber-border);background:var(--amber-bg);border-radius:3px;padding:11px 12px;margin-bottom:22px}
  .banner b{display:block;font-size:11px;font-weight:600;margin-bottom:5px}
  .banner span{font-size:10.5px}
  .banner.ack{display:flex;align-items:center;gap:12px;justify-content:space-between}
  .banner.mc{background:var(--green-50);border-color:var(--green-100)}
  .po-title{font-size:12px;font-weight:600;margin:0 0 12px 10px;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(16,24,40,.08);padding:16px;margin-bottom:22px}
  .parties{border:1px solid var(--border);border-radius:6px;padding:12px;display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:18px;margin:14px 0 26px}
  .parties .k{font-size:8.5px;color:var(--muted);margin-bottom:5px}
  .parties .n{font-size:10.5px;font-weight:600;margin-bottom:4px}
  .parties .v{font-size:9.5px;line-height:1.55;color:#33333B}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sec-head h3{font-size:11px;font-weight:600;margin:0}
  .items{border:1px solid var(--border)}
  .items th{background:var(--head);font-size:9.5px;font-weight:600;color:#55555F;padding:9px 6px;text-align:center;border-left:1px solid var(--border);vertical-align:top;line-height:1.35}
  .items th:first-child{text-align:left;border-left:none;width:34%}
  .items td{border-top:1px solid var(--border);border-left:1px solid var(--border);font-size:10.5px;text-align:center;padding:10px 6px;vertical-align:middle}
  .items td:first-child{text-align:left;border-left:none;vertical-align:top}
  .code{font-weight:700;font-size:10.5px;margin-bottom:3px}
  .desc{font-size:9.5px;color:var(--muted);margin-bottom:6px;line-height:1.4}
  .notes{font-size:9.5px;line-height:1.55;color:#33333B}
  .mc-row td{background:#FBFCFB;padding:8px 10px!important;text-align:left!important}
  .mc-toggle{background:none;border:none;padding:0;font-size:9.5px;font-weight:700;color:var(--green-600);letter-spacing:.2px;display:inline-flex;align-items:center;gap:5px}
  .mc-meter{display:inline-block;width:90px;height:5px;border-radius:3px;background:var(--green-100);vertical-align:middle;margin:0 8px 0 14px;overflow:hidden}
  .mc-meter span{display:block;height:100%;background:var(--green)}
  .mini{margin-top:8px;border:1px solid var(--border);background:#fff}
  .mini th{background:var(--head);font-size:9.5px;font-weight:600;text-align:left;padding:7px 8px;border:none!important}
  .mini td{font-size:10px;text-align:left!important;padding:7px 8px!important;border-left:none!important;vertical-align:middle!important}
  .simple{border:1px solid var(--border);background:#fff}
  .simple th{background:var(--head);font-size:10px;font-weight:600;padding:9px 10px;text-align:center;border-left:1px solid var(--border)}
  .simple td{font-size:10.5px;padding:10px;text-align:center;border-top:1px solid var(--border);border-left:1px solid var(--border)}
  .simple th:first-child,.simple td:first-child{border-left:none}
  .simple.light th{background:var(--head);color:#55555F;font-weight:500;font-size:9.5px}
  .none-box{display:inline-block;border:1px solid var(--border);padding:7px 6px;font-size:10px;margin-top:2px}
  .sec-lbl{font-size:9.5px;font-weight:600;margin:24px 0 10px}
  .totals{display:flex;justify-content:flex-end;gap:28px;padding:12px 6px 0;font-size:10.5px}
  .totals b{font-size:12px}

  /* ---------- Modal / toast ---------- */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.4);display:grid;place-items:center;z-index:50;padding:16px}
  .modal{background:#fff;border-radius:10px;width:min(640px,100%);max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
  .modal-h h4{margin:0;font-size:13px}
  .modal-h button{border:none;background:none;font-size:18px;color:var(--muted);line-height:1}
  .modal-b{padding:16px 18px}
  .modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .kv .k{font-size:9.5px;color:var(--muted);margin-bottom:3px}
  .kv .v{font-size:11px;font-weight:600}
  .mc-hint{font-size:9.5px;color:var(--muted);margin:8px 0 -2px}
  .mc-id{background:none;border:none;padding:0;font-size:10px;font-weight:700;color:var(--green-600);text-decoration:underline;text-underline-offset:2px;display:inline-flex;align-items:center;gap:3px}
  .mc-id:hover{color:var(--green)}
  .ir-sub td{background:#F6F8F7!important;padding:4px 10px 10px 26px!important}
  /* per-line tracking panel: MC / IR / Dispatch tabs that belong to the line item directly above */
  .items tr.has-panel > td{border-bottom:none}
  .items tr.lp-row > td{padding:0 12px 22px!important;text-align:left!important;border-left:none!important;border-top:none!important;border-bottom:3px solid #DADDE1;background:#fff}
  .lp{border:1px solid var(--green-100);border-left:4px solid var(--green);border-radius:0 0 6px 6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .lp-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;background:var(--green-50);border-bottom:1px solid var(--green-100);font-size:10px}
  .lp-title{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--green-600);display:inline-flex;align-items:center;gap:6px}
  .lp-title .ln{background:var(--green);color:#fff;border-radius:3px;padding:1px 6px;font-size:9.5px;letter-spacing:.02em}
  .lp-title .cd{color:var(--text);text-transform:none;letter-spacing:0;font-weight:600}
  .lp-head .mc-meter{margin-left:auto}
  .lp-tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--border);background:#fff}
  .lp-tab{border:none;background:none;padding:9px 12px 8px;font-size:11px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
  .lp-tab:hover{color:var(--text)}
  .lp-tab.on{color:var(--green-600);border-bottom-color:var(--green);font-weight:600}
  .lp-tab .n{min-width:16px;height:16px;border-radius:8px;background:var(--row-alt);display:grid;place-items:center;font-size:9.5px;font-weight:700;padding:0 4px;color:var(--text)}
  .lp-tab.on .n{background:var(--green);color:#fff}
  .lp-tab .dot{width:6px;height:6px;border-radius:50%;background:#E0A21B}
  .lp-body{padding:10px 12px 12px;overflow-x:auto}
  .lp-body .mini{margin-top:0}
  .lp-body .mc-hint{margin:0 0 8px}
  .lp-empty{padding:12px 2px;font-size:10.5px;color:var(--faint)}
  .reopen{font-size:9px;color:var(--green-600);margin-top:3px;white-space:nowrap}
  .btn-xs{height:22px;padding:0 8px;font-size:10px;white-space:nowrap}
  .lp-body td.nw{white-space:nowrap}
  .ir-sub .mini{margin-top:4px}
  .ir-sub .mini th{background:#ECEFED}
  .st-IRP{background:var(--amber-bg);color:var(--amber)}
  .st-IRA{background:var(--green-50);color:var(--green-600)}
  .st-IRPA{background:var(--blue-bg);color:var(--blue)}
  .st-IRR{background:var(--red-bg);color:var(--red)}
  .strip{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--border);border-radius:6px;margin:4px 0 16px;overflow:hidden}
  .strip div{padding:9px 10px;border-left:1px solid var(--border)}
  .strip div:first-child{border-left:none}
  .strip .k{font-size:9px;color:var(--muted);margin-bottom:3px}
  .strip .v{font-size:13px;font-weight:600}
  .strip .hi{background:var(--green-50)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .field label{display:block;font-size:9.5px;font-weight:600;color:#44444C;margin-bottom:4px}
  .field .hint{font-size:9.5px;color:var(--muted);margin-top:4px}
  .field .err{font-size:9.5px;color:var(--red);margin-top:4px}
  .inp{width:100%;height:32px;border:1px solid #D3D6D9;border-radius:4px;padding:0 9px;font-size:11.5px;background:#fff}
  textarea.inp{height:auto;padding:8px 9px;resize:vertical}
  .inp:focus{outline:2px solid var(--green-100);border-color:var(--green)}
  .inp.bad{border-color:var(--red)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .sub-h{font-size:10.5px;font-weight:600;margin:4px 0 8px}
  .btn-del{display:inline-flex;align-items:center;gap:4px;border:1px solid #F3C9C9;background:var(--red-bg);color:var(--red);border-radius:4px;padding:3px 8px;font-size:9.5px;font-weight:600}
  .btn-del:hover{background:#FADADA}
  .btn-danger{background:var(--red);border-color:var(--red);color:#fff}
  .btn-danger:hover{background:#B83A3A}
  .ir-filter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .ir-filter button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:14px;padding:4px 10px;font-size:10.5px;color:var(--text)}
  .ir-filter button .n{min-width:16px;height:16px;border-radius:8px;background:var(--row-alt);display:grid;place-items:center;font-size:9.5px;font-weight:700;padding:0 4px}
  .ir-filter button.on{border-color:var(--green);background:var(--green-50);color:var(--green-600);font-weight:600}
  .ir-filter button.on .n{background:var(--green);color:#fff}
  .ir-filter button:disabled{opacity:.45;cursor:default}
  .stage-sub{margin-top:3px}
  .st-IRRP{background:#EEE9FB;color:#5B3FC4}
  .ir-view .sec{font-size:10px;font-weight:700;letter-spacing:.3px;color:#44444C;margin:18px 0 8px;text-transform:uppercase}
  .ir-view .sec:first-child{margin-top:0}
  .ir-line{border:1px solid var(--border);border-radius:6px;margin-bottom:12px;overflow:hidden}
  .ir-line-h{background:var(--head);padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
  .ir-line-h .code{margin:0;font-size:11px}
  .ir-line-h .m{font-size:9.5px;color:var(--muted)}
  .ir-line-h .m b{color:var(--text);font-weight:600}
  .ir-line .desc{padding:6px 12px 0;margin:0}
  .ir-line .mini{margin:8px 0 0;border:none;border-top:1px solid var(--border)}
  .ir-line .mini td{vertical-align:top!important}
  .tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--green-100)}
  .tl li{position:relative;padding:0 0 10px 6px;font-size:10.5px}
  .tl li::before{content:'';position:absolute;left:-20px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--green)}
  .tl li .faint{display:block;font-size:9.5px}
  /* Approval timeline (IR view): blue = pending on approver, green = approved / done, red = declined */
  .atl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin:-2px 0 12px}
  .atl-legend span{display:inline-flex;align-items:center;gap:5px}
  .atl-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .atl{position:relative;padding-left:34px;margin-bottom:6px}
  .atl::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:2px;background:#E2E4E8}
  .atl-item{position:relative;background:#F2F3F5;border-radius:6px;padding:10px 12px;margin-bottom:16px;max-width:380px;font-size:10.5px;line-height:1.75;color:#55575E}
  .atl-item:last-child{margin-bottom:0}
  .atl-item .lb{color:var(--text)}
  .atl-item .nm{font-weight:600;color:var(--text)}
  .atl-item .ln{margin-top:4px}
  .atl-item .cmt{margin-top:4px;font-style:italic}
  .atl-dot{position:absolute;left:-34px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 3px #fff}
  .atl-dot.pending{background:var(--blue)}
  .atl-dot.approved{background:#2F9E62}
  .atl-dot.declined{background:var(--red)}
  .atl-dot.upcoming{background:#D5D8DD}
  .modal.xwide{width:min(1180px,100%)}
  .modal.wide{width:min(1000px,100%)}
  .mc-cb{width:13px;height:13px;accent-color:var(--green);cursor:pointer;vertical-align:middle}
  .mc-cb:disabled{cursor:not-allowed;opacity:.4}
  .mini tr.sel td{background:var(--green-50)}
  .sel-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#1D1D22;color:#fff;border-radius:10px;
    padding:9px 10px 9px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:11.5px;max-width:calc(100% - 32px)}
  .sel-bar b{color:#9FE3BF}
  .sel-bar .btn-ghost{background:transparent;color:#fff;border-color:#55555F}
  .sel-bar .btn-ghost:hover{background:#2A2A30}
  .merge td,.merge th{text-align:left!important}

/* Manufacturing Clearance created by the buyer in ../Buyer.html is shared through localStorage
   (same origin, e.g. Live Server). When present it replaces the seeded clearances for that PO. */
const MC_STORE = 'trident.mc.v1';
/* Any buyer PO that has a Manufacturing Clearance is published by the buyer with its full details (saved.meta).
   POs not already in ORDERS are built here under the right vendor account (created if new), so every clearance
   the buyer creates shows up on the Vendor Portal straight away and the vendor can raise Inspection Requests on it. */
const isoDay = v => { const [y, mo, d] = String(v).split('-').map(Number); return new Date(y, mo - 1, d); };
function vendorKeyFor(v) {
  let key = Object.keys(VENDORS).find(k => VENDORS[k].name.toUpperCase() === v.name.toUpperCase());
  if (!key) {
    key = 'v_' + v.gstin;
    VENDORS[key] = { name: v.name.toUpperCase(), email: v.email || '—', phone: v.phone || '—', contact: 'Sales Desk',
      gstin: v.gstin, pan: v.gstin.slice(2, 12), code: '—', addr: [v.address] };
  }
  return key;
}
/* POs the buyer sends for acknowledgement (trident.po.v1) — the vendor's acknowledgement goes back through trident.poack.v1,
   and the Buyer Portal moves the PO on from Vendor Acknowledgement Pending as soon as it sees it */
const PO_STORE = 'trident.po.v1', PO_ACK_STORE = 'trident.poack.v1';
const SENT_PO = ['ACK','GRN','INVOICE','CLOSED','CANCELLED'];
const readAcks = () => { try { return JSON.parse(localStorage.getItem(PO_ACK_STORE))?.acks || {}; } catch (e) { return {}; } };
function writeAck(o) {
  const acks = readAcks();
  acks[o.no] = { at: new Date().toISOString(), by: VENDORS[o.vendor].name };
  try { localStorage.setItem(PO_ACK_STORE, JSON.stringify({ acks })); } catch (e) {}
}
// buyer status → vendor status
function vendorStatus(meta, prev) {
  if (meta.status === 'CLOSED' || meta.status === 'CANCELLED') return meta.status;
  if (meta.status === 'ACK') return readAcks()[meta.number] ? 'OPEN' : 'ACK';
  return prev?.status === 'INV' ? 'INV' : 'OPEN';
}
function buildBuyerPO(meta, prev) {
  const offKey = 'B:' + meta.office.name;
  OFFICES[offKey] = { name: meta.office.name, addr: meta.office.address || meta.office.name, gstin: meta.office.gstin || '—' };
  const open = new Map((prev?.lines || []).map(l => [l.ref, l.mcOpen]));
  return { id: 700000 + meta.id, vendor: vendorKeyFor(meta.vendor), no: meta.number, fromBuyer: true,
    status: vendorStatus(meta, prev),
    date: isoDay(meta.created), office: offKey, deliveryDate: isoDay(meta.endDate), lineDate: isoDay(meta.endDate), title: meta.title || 'NA',
    lines: meta.lines.map(l => L(l.code, l.ref, l.desc, l.productCode, l.qty, l.price,
      { hsn: l.hsn, unit: l.unit, gst: l.gst, delivered: l.delivered, invoiced: l.invoiced, mcOpen: open.get(l.ref) ?? true })),
    grns: [], condGrns: [], invoices: [], amendments: [] };
}
function loadBuyerMcs() {
  let saved = null, sent = null;
  if (FLOW_MCIRDI) try { saved = JSON.parse(localStorage.getItem(MC_STORE)); } catch (e) {}
  try { sent =JSON.parse(localStorage.getItem(PO_STORE)); } catch (e) {}
  const meta = { ...(saved?.meta || {}) };
  Object.values(sent?.pos || {}).forEach(m => { if (SENT_PO.includes(m.status)) meta[m.number] = m; });
  // add / refresh POs published by the buyer; drop ones that are no longer shared
  for (let i = ORDERS.length - 1; i >= 0; i--) if (ORDERS[i].fromBuyer && !meta[ORDERS[i].no]) ORDERS.splice(i, 1);
  Object.values(meta).forEach(m => {
    const at = ORDERS.findIndex(o => o.no === m.number);
    if (at < 0) ORDERS.push(buildBuyerPO(m));
    else if (ORDERS[at].fromBuyer) ORDERS[at] = buildBuyerPO(m, ORDERS[at]);
  });
  if (!saved?.pos) return;
  ORDERS.forEach(o => {
    const byRef = saved.pos[o.no];
    if (!byRef) return;
    o.lines.forEach(l => {
      l.mcs = (byRef[l.ref] || []).map(m => {
        const [y, mo, d] = m.date.split('-').map(Number);
        return { id: m.id, qty: m.qty, officeName: m.officeName, address: m.address, date: new Date(y, mo - 1, d),
          createdAt: new Date(m.createdAt), status: m.status, irRequired: m.irRequired !== false,
          withdrawnAt: m.withdrawnAt ? new Date(m.withdrawnAt) : null, withdrawReason: m.withdrawReason || '' };
      });
      if (l.mcs.length && l.mcOpen === undefined) l.mcOpen = true;
    });
  });
}

/* =====================================================================
   Inspection Requests — vendor raises them against one or more Manufacturing Clearances.
   Shared through localStorage (same origin, e.g. Live Server) with:
     · ../Employee Portal — approvers (QA Head → Procurement Manager) approve / decline / hold / ask for clarification
     · ../Buyer portal    — Trident admin records the inspection result and raises the Dispatch Instruction
   ===================================================================== */
const IR_STORE = 'trident.ir.v2';
const APPROVERS = { priya: { name: 'Priya Nair', role: 'QA Head' }, rahul: { name: 'Rahul Verma', role: 'Procurement Manager' } };
const IR_CHAIN = ['priya', 'rahul'];
const apprName = k => APPROVERS[k]?.name || k;
let irMem = [];
/* IR lifecycle: Pending (in approval on the Employee Portal) → Result Pending (approved) → Ready to Dispatch / Rejected (inspection recorded)
   Side exits: Declined (by an approver) · Withdrawn (by the vendor, while still in approval) */
const readIRs = () => { if (!FLOW_MCIRDI) return []; try { const v = localStorage.getItem(IR_STORE); return v ? (JSON.parse(v).irs || []).map(x => x.status === 'Report Pending' ? { ...x, status: 'Result Pending' } : x) : irMem; } catch (e) { return irMem; } };
const isRecorded = r => r.status === 'Ready to Dispatch' || r.status === 'Rejected';
const isClosedIr = r => r.status === 'Withdrawn' || r.status === 'Declined';
const writeIRs = irs => { irMem = irs; try { localStorage.setItem(IR_STORE, JSON.stringify({ irs })); } catch (e) {} };
/* Dispatch Instructions: one per Inspection Request, raised by Trident for all accepted quantity;
   the vendor submits one invoice against each */
const DR_STORE = 'trident.dr.v2';
let drMem = [];
/* Vendor invoices are many-to-many with Dispatch Instructions: one invoice can bill items of several DIs on a PO, and a DI's
   items can be billed across several invoices. Each invoice item points at { dr, idx } — a DI and the index of its item. */
const INV_STORE = 'trident.inv.v1';
let invMem = [];
const readInvs = () => { if (!FLOW_MCIRDI) return []; try { const v = localStorage.getItem(INV_STORE); return v ? JSON.parse(v).invs || [] : invMem; } catch (e) { return invMem; } };
const writeInvs = invs => { invMem = invs; try { localStorage.setItem(INV_STORE, JSON.stringify({ invs })); } catch (e) {} };
/* overlay the invoices on a DI: item.inv, invList, status, and a summary d.invoice once every item is billed */
function withInvoices(d, invs) {
  const list = invs.filter(v => v.items.some(y => y.dr === d.id));
  if (!list.length) return d;   // nothing billed yet, or a DI invoiced as a whole before item-level invoicing (d.invoice)
  const items = d.items.map((x, i) => ({ ...x, inv: list.find(v => v.items.some(y => y.dr === d.id && y.idx === i))?.no || null }));
  const done = items.every(x => x.inv), last = list.reduce((a, v) => v.createdAt > a.createdAt ? v : a);
  const share = r2(list.reduce((a, v) => a + v.items.filter(y => y.dr === d.id).reduce((b, y) => b + y.qty * y.price * (1 + (y.gst + (y.cess || 0)) / 100), 0), 0));
  return { ...d, items, invList: list, status: done ? 'Invoice Submitted' : 'Partially Invoiced',
    invoice: done ? { no: list.map(v => v.no).join(', '), date: last.date, amount: share, docs: list.flatMap(v => v.docs || []), remarks: '', createdAt: last.createdAt } : null };
}
const readDRs = () => { if (!FLOW_MCIRDI) return []; const invs = readInvs(); try { const v = localStorage.getItem(DR_STORE);
  return (v ? (JSON.parse(v).drs || []).map(d => /^DR-/.test(d.id) ? { ...d, id: 'DI-' + d.id.slice(3) } : d) : drMem).map(d => withInvoices(d, invs)); } catch (e) { return drMem; } };
/* the invoice overlay is derived on read, never stored */
const writeDRs = drs => { drs = drs.map(({ invList, ...d }) => invList ? { ...d, invoice: null, status: 'Invoice Pending', items: d.items.map(({ inv, ...x }) => x) } : d);
  drMem = drs; try { localStorage.setItem(DR_STORE, JSON.stringify({ drs })); } catch (e) {} };
const drsOf = o => readDRs().filter(d => d.po === o.no);
const drOfIr = r => readDRs().find(d => d.po === r.po && d.irId === r.id);
const drAmount = d => r2(d.items.reduce((a, x) => a + x.qty * x.price * (1 + x.gst / 100), 0));
const drChip = st => `<span class="chip st-${st === 'Invoice Submitted' ? 'DRA' : st === 'Partially Invoiced' ? 'DRP' : 'DRR'}">${st}</span>`;
/* clearances released with "Inspection Required" off skip the IR flow: Ready to Dispatch at once, Trident raises the DR on the MC itself */
const irReq = m => m.irRequired !== false;
const drOfMc = (o, mcId) => readDRs().find(d => d.po === o.no && !d.irId && d.mcId === mcId);
const mcDirectStage = (o, m) => { const d = drOfMc(o, m.id); return !d ? 'Ready to Dispatch' : d.invoice ? 'Invoice Submitted' : 'Invoice Pending'; };
/* invoices on the PO: seeded ones + those submitted against Dispatch Instructions */
const invoicesOf = o => [...o.invoices,
  ...readInvs().filter(v => v.po === o.no).map(v => ({ no: v.no, date: parseISO(v.date), amount: v.amount, status: v.status, drs: [...new Set(v.items.map(y => y.dr))] })),
  ...drsOf(o).filter(d => d.invoice && !d.invList).map(d => ({ no: d.invoice.no, date: parseISO(d.invoice.date), amount: d.invoice.amount, status: 'Submitted', drs: [d.id] }))];
const IR_ST = { 'Pending':'IRP', 'Result Pending':'IRRP', 'Ready to Dispatch':'IRA', 'Invoice Pending':'IRPA', 'Invoice Submitted':'IRA',
  'Rejected':'IRR', 'Declined':'IRD', 'Withdrawn':'IRW' };
const irChip = st => `<span class="chip st-${IR_ST[st] || 'IRP'}">${st}</span>`;
const irsOf = (o, m) => readIRs().filter(r => r.po === o.no && r.mcId === m.id);
/* qty that can still be offered = MC qty − accepted − qty in live IRs (rejected / declined / withdrawn qty can be re-offered) */
function irSummary(m, irs) {
  const sum = f => r2(irs.reduce((a, r) => a + (f(r) || 0), 0));
  const pending = sum(r => !isRecorded(r) && !isClosedIr(r) ? r.qty : 0);
  const accepted = sum(r => r.accepted), rejected = sum(r => r.rejected);
  return { pending, accepted, rejected, available: isWithdrawnMc(m) || !irReq(m) ? 0 : Math.max(0, r2(m.qty - accepted - pending)) };
}
const isoD = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const parseISO = v => { const [y, mo, d] = v.split('-').map(Number); return new Date(y, mo - 1, d); };
/* where the IR is in approval / why it closed — one line under the status chip */
function apprNote(r) {
  const a = r.appr, waived = (a?.history || []).find(h => h.waive);
  if (r.status === 'Pending' && a) return `<div class="appr-note">${a.state === 'hold' ? 'On hold with' : 'With'} ${apprName(a.chain[a.level])} · level ${a.level + 1} of ${a.chain.length}${waived ? ' · inspection waived' : ''}</div>`;
  if (r.inspectionWaived) return `<div class="appr-note">Inspection waived by ${apprName(waived?.by)}</div>`;
  if (r.status === 'Declined') return `<div class="appr-note">Declined by ${esc(r.declinedBy || 'approver')}${r.declineReason ? ` · “${esc(r.declineReason)}”` : ''}</div>`;
  if (r.status === 'Withdrawn') return `<div class="appr-note">Withdrawn ${r.withdrawnAt ? fmtD(new Date(r.withdrawnAt)) : ''}${r.withdrawReason ? ` · “${esc(r.withdrawReason)}”` : ''}</div>`;
  return '';
}

/* A merged IR is stored as one record per MC item: same id, item n of N, key "IR-…#n" */
function irTable(irs, o = null, withMc = false) {
  const all = readIRs();
  return `<table class="mini"><thead><tr><th>Inspection Request</th>${withMc ? '<th>MC ID</th>' : ''}<th>Inspection Qty</th><th>Proposed Inspection Date</th><th>Raised On</th>
    <th>Accepted Qty</th><th>Rejected Qty</th><th>Status</th><th>Dispatch Instruction</th><th>Action</th></tr></thead>
    <tbody>${irs.map(r => {
      const dr = drOfIr(r);
      const others = r.items > 1 ? all.filter(x => x.po === r.po && x.id === r.id && x.mcId !== r.mcId).map(x => x.mcId) : [];
      return `<tr class="${isClosedIr(r) ? 'wd' : ''}"><td><button class="mc-id" data-ir-open="${r.id}" title="View Inspection Request ${r.id}">${r.id} ${icon('chevR', 9, 2.6)}</button>${others.length ? `<div class="merge-note" style="white-space:normal;max-width:200px">Item ${r.item} of ${r.items} · merged with ${others.join(', ')}</div>` : ''}</td>
      ${withMc ? `<td class="nw">${esc(r.mcId)}</td>` : ''}<td>${fmtN(r.qty)}</td><td>${fmtD(parseISO(r.inspDate))}</td><td>${fmtDT(new Date(r.createdAt))}</td>
      <td>${!isRecorded(r) ? '<span class="faint">—</span>' : `<b style="color:var(--green-600)">${fmtN(r.accepted)}</b>`}</td>
      <td>${!isRecorded(r) ? '<span class="faint">—</span>' : `<b style="color:${r.rejected ? 'var(--red)' : 'inherit'}">${fmtN(r.rejected)}</b>${r.rejected > 0 ? '<div class="reopen">↺ reopened for inspection</div>' : ''}`}</td>
      <td>${irChip(r.status)}${apprNote(r)}${r.inspRemarks ? `<div class="faint" style="margin-top:3px;white-space:normal;max-width:200px">${esc(r.inspRemarks)}</div>` : ''}</td>
      <td>${dr ? `<button class="mc-id" data-dr="${dr.id}">${dr.id}</button> ${drChip(dr.status)}` : '<span class="faint">—</span>'}</td>
      <td>${irWithdrawable(r.po, r.id) ? `<button class="btn-del" data-ir-wd="${r.id}" title="Withdraw ${r.id}">${icon('back', 9, 2.4)} Withdraw</button>`
        : reinspectable(o, r) ? `<button class="btn btn-primary btn-xs" data-ir-redo="${r.mcId}" data-ir-redo-qty="${r.rejected}" title="Raise a new Inspection Request for the rejected quantity">${icon('plus', 9, 2.6)} Re-inspect</button>`
        : '<span class="faint">—</span>'}</td></tr>`; }).join('')}</tbody></table>`;
}
/* rejected qty goes back into the clearance's available qty, so it can be offered for inspection again */
function reinspectable(o, r) {
  if (!o || !isRecorded(r) || !(r.rejected > 0)) return false;
  const f = findMc(o, r.mcId);
  return !!f && mcAvail(o, f.m) > 0;
}

/* ---------- Withdrawing an Inspection Request ----------
   Allowed while the IR is still in approval (status Pending, incl. on hold). A merged IR is withdrawn as a whole.
   The record stays on every portal with status Withdrawn; its quantity becomes available for inspection again. */
const irItems = (po, id) => readIRs().filter(r => r.po === po && r.id === id).sort((a, b) => (a.item || 1) - (b.item || 1));
const irWithdrawable = (po, id) => { const it = irItems(po, id); return it.length > 0 && it.every(r => r.status === 'Pending'); };
function irWithdrawModal(o, id) {
  const items = irItems(o.no, id);
  if (!irWithdrawable(o.no, id)) return toast(`${id} is no longer in approval and can't be withdrawn`);
  modal(`Withdraw Inspection Request · ${id}`, `
    <p style="margin:0 0 12px;font-size:12px">Withdrawing stops the approval of <b>${id}</b>${items.length > 1 ? ` and all <b>${items.length}</b> of its merged items` : ''}.
      The request stays on record as <b>Withdrawn</b> for you and Trident, and the quantity becomes available for inspection again on ${items.length > 1 ? 'each clearance' : 'the clearance'}.</p>
    <table class="mini merge"><thead><tr><th>Item</th><th>MC ID</th><th>Line Item</th><th>Inspection Qty</th><th>Proposed Date</th></tr></thead>
      <tbody>${items.map(r => `<tr><td>${r.item || 1}</td><td><b>${r.mcId}</b></td><td>${r.lineCode}</td><td>${fmtN(r.qty)}${r.unit ? ` <span class="faint">${r.unit}</span>` : ''}</td>
        <td>${fmtD(parseISO(r.inspDate))}</td></tr>`).join('')}</tbody></table>
    <div class="field" style="margin-top:14px"><label for="wdReason">Reason for withdrawal *</label>
      <textarea class="inp" id="wdReason" rows="2" placeholder="e.g. Material re-scheduled, will re-offer next week"></textarea>
      <div class="err" id="wdReasonErr" hidden></div></div>`,
    `<button class="btn btn-ghost" data-close-btn>Cancel</button>
     <button class="btn btn-danger" data-ir-wd-ok="${id}">${icon('back', 10, 2.4)} Withdraw Inspection Request</button>`);

function irWithdraw(o, id) {
  const ta = document.getElementById('wdReason'), reason = ta.value.trim(), err = document.getElementById('wdReasonErr');
  err.hidden = !!reason; err.textContent = reason ? '' : 'Please add a reason'; ta.classList.toggle('bad', !reason);
  if (!reason) return;

  const all = readIRs(), at = new Date().toISOString();

    appr: { ...r.appr, state: 'withdrawn' } }); });
  writeIRs(all);
  closeModal(); rerender();
  toast(`${id} withdrawn`);
}

/* ---------- Inspection Request view: one IR, all its line items and the MC schedule behind every item ---------- */
function irOverall(items) {
  const s = items[0].status;
  if (s === 'Withdrawn' || s === 'Declined') return s;
  if (items.some(r => r.status === 'Pending')) return 'Pending';
  if (items.some(r => r.status === 'Result Pending')) return 'Result Pending';
  return items.some(r => r.status === 'Ready to Dispatch') ? 'Ready to Dispatch' : 'Rejected';
}
/* filter stage: once Ready to Dispatch, how far dispatch has got — tells the supplier where an invoice is due */
const IR_STAGES = [
  ['Pending', 'In approval at Trident'], ['Result Pending', 'Approved · inspection report awaited'], ['Ready to Dispatch', 'Inspected · awaiting Dispatch Instruction'],
  ['Invoice Pending', 'Dispatch Instruction received · submit the invoice'], ['Invoice Submitted', 'Invoice submitted against the Dispatch Instruction'],
  ['Rejected', 'Nothing accepted'], ['Declined', 'Declined by a Trident approver'], ['Withdrawn', 'Withdrawn by you'] ];
function irStage(items) {
  const st = irOverall(items);
  if (st !== 'Ready to Dispatch') return st;
  const dr = drOfIr(items[0]);
  return !dr ? 'Ready to Dispatch' : dr.invoice ? 'Invoice Submitted' : 'Invoice Pending';
}
const unitTotals = (items, f) => {
  const u = {};
  items.forEach(r => { const k = r.unit || ''; u[k] = r2((u[k] || 0) + (f(r) || 0)); });
  return Object.entries(u).map(([k, q]) => `${fmtN(q)}${k ? ` ${k}` : ''}`).join(' + ') || '0';
};
/* all IRs of a PO, one row each (a merged IR is several stored items) */
function irGroups(o) {
  const g = new Map();
  readIRs().filter(r => r.po === o.no).forEach(r => { if (!g.has(r.id)) g.set(r.id, []); g.get(r.id).push(r); });
  return [...g.entries()].map(([id, items]) => ({ id, items: items.sort((a, b) => (a.item || 1) - (b.item || 1)) }))
    .sort((a, b) => new Date(b.items[0].createdAt) - new Date(a.items[0].createdAt));
}
function irSection(o) {
  const groups = irGroups(o);
  if (!groups.length) return '';
  groups.forEach(g => g.stage = irStage(g.items));
  const f = ui.irFilter || 'All', count = st => groups.filter(g => g.stage === st).length;
  const shown = f === 'All' ? groups : groups.filter(g => g.stage === f);
  return `<div class="sec-lbl" id="inspection">INSPECTION REQUESTS</div>

      ${IR_STAGES.map(([st, hint]) => `<button class="${f === st ? 'on' : ''}" data-ir-filter="${st}" title="${hint}" ${count(st) || f === st ? '' : 'disabled'}>${st} <span class="n">${count(st)}</span></button>`).join('')}
    </div>
    ${shown.length ? '' : `<div class="placeholder" style="padding:22px">No Inspection Requests with status ${f}</div>`}
    ${shown.length ? `<div class="table-wrap"><table class="simple dr-table">
      <thead><tr><th style="text-align:left">Inspection Request</th><th>Items</th><th style="text-align:left">Manufacturing Clearances</th><th>Line Items</th>
        <th>Inspection Qty</th><th>Accepted</th><th>Rejected</th><th>Proposed Date</th><th>Status</th><th>Dispatch Instruction</th><th>Action</th></tr></thead>
      <tbody>${shown.map(({ id, items, stage }) => { const r0 = items[0], st = irOverall(items), dr = drOfIr(r0); return `<tr>
        <td style="text-align:left"><button class="mc-id" data-ir-open="${id}">${id} ${icon('chevR', 9, 2.6)}</button><div class="faint">${fmtDT(new Date(r0.createdAt))}</div></td>
        <td>${items.length}</td>
        <td style="text-align:left;white-space:normal;max-width:220px">${items.map(r => r.mcId).join(', ')}</td>
        <td>${new Set(items.map(r => r.lineCode)).size}</td>
        <td>${unitTotals(items, r => r.qty)}</td>

        <td>${items.some(isRecorded) ? unitTotals(items, r => r.rejected) : '—'}</td>
        <td>${fmtD(parseISO(r0.inspDate))}</td>
        <td>${irChip(st)}${stage !== st ? `<div class="stage-sub">${irChip(stage)}</div>` : ''}${apprNote(r0)}</td>

function irViewModal(o, id) {

  const r0 = items[0], done = items.filter(isRecorded), stOverall = irOverall(items), stage = irStage(items);
  const dr = drOfIr(r0);
  const a = r0.appr || { chain: IR_CHAIN, level: 0, state: 'pending', history: [], clar: [] };
  // group the items by PO line item
  const byLine = new Map();
  items.forEach(r => { const f = findMc(o, r.mcId); const k = r.lineRef; if (!byLine.has(k)) byLine.set(k, { l: f?.l || o.lines.find(x => x.ref === r.lineRef), rows: [] }); byLine.get(k).rows.push({ r, m: f?.m }); });
  // Timeline: App Started → each approver in the chain → what happened after approval
  const created = new Date(r0.createdAt);
  const tl = [{ st:'approved', lb:'App Started', nm:`Submitted by ${r0.by || VENDOR.name}`, ln:['Type: start', `Status: ${items.length} item${items.length > 1 ? 's' : ''} raised`, `Sent on: ${fmtDT(created)}`] }];
  a.chain.forEach((k, i) => {
    const h = a.history.find(x => (x.t === 'approved' || x.t === 'declined') && x.by === k);
    const hold = [...a.history].reverse().find(x => x.t === 'hold' && x.by === k);
    let st, status;
    if (h) { st = h.t; status = h.t.toUpperCase(); }
    else if (stOverall === 'Pending' && i === a.level) { st = 'pending'; status = a.state === 'hold' ? 'ON HOLD' : 'PENDING ON APPROVER'; }

    tl.push({ st, lb: `Approver ${i + 1}`, nm: `${apprName(k)} · ${APPROVERS[k]?.role || ''}`,
      ln: ['Type: INSPECTION-REQUEST', `Status: ${status}${h?.waive ? ' · INSPECTION WAIVED' : ''}`, ...(h ? [`${h.t === 'approved' ? 'Approved' : 'Declined'} on: ${fmtDT(new Date(h.at))}`] : [])],
      cmt: h?.note || (st === 'pending' && a.state === 'hold' ? hold?.note : '') });
  });
  if (stOverall === 'Withdrawn') tl.push({ st:'declined', lb:'Withdrawn', nm:`by ${r0.withdrawnBy || VENDOR.name}`, ln:[`On: ${fmtDT(new Date(r0.withdrawnAt))}`], cmt: r0.withdrawReason });
  const later = [];
  done.forEach(r => later.push({ at: r.inspectedAt ? parseISO(r.inspectedAt) : created, st: r.accepted > 0 ? 'approved' : 'declined', lb: r.inspectionWaived ? 'Inspection Waived' : 'Inspection Recorded',
    nm:`Item ${r.item || 1} · ${r.mcId}`, ln:[`Status: ${r.status.toUpperCase()}`, `${fmtN(r.accepted)} accepted · ${fmtN(r.rejected)} rejected`, ...(r.inspector ? [`Inspector: ${r.inspector}`] : [])] }));
  if (dr) {
    later.push({ at: new Date(dr.createdAt), st:'approved', lb:'Dispatch Instruction', nm:`${dr.id} released by Trident`, ln:[`${unitTotals(dr.items, x => x.qty)} · dispatch by ${fmtD(parseISO(dr.dispatchBy))}`, `Sent on: ${fmtDT(new Date(dr.createdAt))}`] });
    if (dr.invoice) later.push({ at: new Date(dr.invoice.createdAt), st:'approved', lb:'Invoice', nm:`${dr.invoice.no} submitted`, ln:[`INR ${fmtN(dr.invoice.amount)}`, `Sent on: ${fmtDT(new Date(dr.invoice.createdAt))}`] });
  }
  later.sort((x, y) => x.at - y.at);
  if (stOverall === 'Pending' || stOverall === 'Result Pending') later.push({ st:'upcoming', lb:'Inspection', nm:'Inspection Report', ln:['Status: NOT STARTED'] });
  tl.push(...later);
  const dotIc = { approved: icon('check', 10, 3), declined: icon('x', 10, 3), pending: '', upcoming: '' };
  const dash = '<span class="faint">—</span>';
  const canReply = stOverall === 'Pending';
  modal(`Inspection Request · ${id}`, `<div class="ir-view">
    <div class="sec">Summary</div>

/* ---------- Intermediate screen: every item of the selected clearances, one row per unique MC ---------- */

function irMergeModal(o, ids) {

function drawIrItems(o, errors = {}) {
  const box = document.getElementById('irItems');

  const rows = irDraft.ids.map(id => ({ id, ...findMc(o, id) }));
  const lineCount = new Set(rows.map(r => r.i)).size;
  const addable = o.lines.flatMap(l => l.mcs.filter(m => !irDraft.ids.includes(m.id) && mcAvail(o, m) > 0).map(m => ({ l, m })));
  const units = {};
  rows.forEach(r => { const u = r.l.unit || 'Qty'; units[u] = r2((units[u] || 0) + (+irDraft.qty[r.id] || 0)); });
  box.innerHTML = `<div class="table-wrap"><table class="mini merge" style="margin-top:0">
      <thead><tr><th>#</th><th>MC ID</th><th>Line Item</th><th>Shipping Location</th><th>Earliest Delivery</th><th>Available</th><th>Inspection Qty *</th><th></th></tr></thead>

        <td><input class="inp ${errors[r.id] ? 'bad' : ''}" type="number" min="0" step="any" data-irq="${r.id}" value="${irDraft.qty[r.id] ?? ''}" aria-label="Inspection quantity for ${r.m.id}">
          ${errors[r.id] ? `<div class="err">${errors[r.id]}</div>` : ''}</td>
        <td>${rows.length > 1 ? `<button class="rm" data-irrm="${r.id}" title="Remove ${r.m.id}" aria-label="Remove ${r.m.id}">×</button>` : ''}</td></tr>`; }).join('')}</tbody>
      <tfoot><tr><td colspan="6">${rows.length} item${rows.length > 1 ? 's' : ''} · ${rows.length} unique MC${rows.length > 1 ? 's' : ''} · ${lineCount} line item${lineCount > 1 ? 's' : ''}</td>

  const earliest = new Date(Math.min(...rows.map(r => r.m.date.getTime())));
  const hint = document.getElementById('irDateHint');
  if (hint) hint.textContent = `Earliest delivery among the selected clearances is ${fmtD(earliest)}`;

function submitMergedIR(o) {
  const $ = id => document.getElementById(id);
  const err = (id, msg) => { $(id + 'Err').hidden = !msg; $(id + 'Err').textContent = msg || ''; $(id).classList.toggle('bad', !!msg); return !msg; };
  const rowErr = {};
  irDraft.ids.forEach(id => {
    const q = +irDraft.qty[id], m = findMc(o, id).m, av = mcAvail(o, m);
    if (!irReq(m)) rowErr[id] = 'Inspection not required for this clearance';
    else if (!(q > 0)) rowErr[id] = 'Enter a quantity > 0';
    else if (q > av) rowErr[id] = `Max ${fmtN(av)}`;
  });
  const date = $('irDate').value;
  const ok = [
    err('irDate', !date ? 'Select the proposed inspection date' : date < isoD(TODAY) ? 'Date can’t be in the past' : ''),
    err('irLoc', $('irLoc').value.trim() ? '' : 'Inspection location is required'),
    err('irContact', $('irContact').value.trim() ? '' : 'Contact person is required'),
    err('irPhone', $('irPhone').value.trim() ? '' : 'Contact number is required'),
  ].every(Boolean);
  drawIrItems(o, rowErr);
  if (!ok || Object.keys(rowErr).length) return;
  const all = readIRs();
  const used = new Set(all.filter(r => r.po === o.no).map(r => r.id));
  let seq = 1, id;
  do { id = `IR-${o.no.slice(-5)}-${String(seq++).padStart(3, '0')}`; } while (used.has(id));
  // everything the Employee Portal approver and the Buyer need travels with the record
  const common = { id, po: o.no, office: OFFICES[o.office].name, inspDate: date, location: $('irLoc').value.trim(), contact: $('irContact').value.trim(), phone: $('irPhone').value.trim(),
    docs: [...$('irDocs').files].map(f => f.name), remarks: $('irRemarks').value.trim(), createdAt: new Date().toISOString(), by: VENDOR.name,
    vendor: { name: VENDOR.name, gstin: VENDOR.gstin, pan: VENDOR.pan, code: VENDOR.code, addr: VENDOR.addr.join(', '), email: VENDOR.email, phone: VENDOR.phone, contact: VENDOR.contact },
    status: 'Pending', accepted: null, rejected: null, items: irDraft.ids.length,
    appr: { chain: IR_CHAIN, level: 0, state: 'pending', history: [], clar: [] } };
  irDraft.ids.forEach((mcId, n) => {
    const { l, m } = findMc(o, mcId);
    all.push({ ...common, key: `${id}#${n + 1}`, item: n + 1, mcId, lineRef: l.ref, lineCode: l.code, lineDesc: l.desc, unit: l.unit || '',
      mcQty: m.qty, mcLocation: mcLoc(m).name, qty: r2(+irDraft.qty[mcId]) });
  });
  writeIRs(all);
  const n = irDraft.ids.length;
  irDraft.ids.forEach(x => ui.irSel.delete(x));
  irDraft = null;
  closeModal(); rerender();
  toast(`${id} submitted with ${n} item${n > 1 ? 's' : ''} · pending approval with ${apprName(IR_CHAIN[0])}`);
}

const selKey = (d, i) => `${d.id}#${i}`;
const itemInv = (d, i) => d.items[i].inv || (d.invList ? null : d.invoice?.no) || null;
const openIdx = d => d.items.map((x, i) => i).filter(i => !itemInv(d, i));
const itemVal = x => r2(x.qty * x.price * (1 + x.gst / 100));

/* resolve selection keys to { d, i, x }; drops anything since invoiced or no longer this vendor's */

}

/* tax split: CGST + SGST when vendor and billing GSTIN share a state code, IGST otherwise */
function invCalc(v) {
  const intra = VENDOR.gstin.slice(0, 2) === OFFICES[v.o.office].gstin.slice(0, 2);
  const lines = v.items.map(y => { const base = r2(y.qty * y.price), tax = r2(base * y.gst / 100), cess = r2(base * (+y.cess || 0) / 100); return { ...y, base, tax, cessAmt: cess, amt: r2(base + tax + cess) }; });
  const ch = v.charges.map(c => { const base = r2(+c.base || 0), tax = r2(base * (+c.gst || 0) / 100); return { ...c, baseN: base, tax, amt: r2(base + tax) }; });
  const base = r2(lines.reduce((a, y) => a + y.base, 0)), tax = r2(lines.reduce((a, y) => a + y.tax, 0) + ch.reduce((a, c) => a + c.tax, 0));
  const cess = r2(lines.reduce((a, y) => a + y.cessAmt, 0)), charges = r2(ch.reduce((a, c) => a + c.amt, 0));
  return { intra, lines, ch, base, tax, cess, charges, igst: intra ? 0 : tax, cgst: intra ? r2(tax / 2) : 0, sgst: intra ? r2(tax / 2) : 0, total: r2(base + lines.reduce((a, y) => a + y.tax, 0) + cess + charges) };
}

function submitInvoicePanel() {
  const v = invDraft, $ = id => document.getElementById(id);
  const err = (id, msg) => { $(id + 'Err').hidden = !msg; $(id + 'Err').textContent = msg || ''; $(id).classList.toggle('bad', !!msg); return !msg; };
  const taken = new Set([...readInvs().map(x => x.no.toLowerCase()), ...readDRs().filter(d => d.invoice && !d.invList).map(d => d.invoice.no.toLowerCase())]);
  const ok = [
    err('invNo', !v.no ? 'Invoice number is required' : taken.has(v.no.toLowerCase()) ? 'This invoice number is already used' : ''),
    err('invDate', v.date ? '' : 'Invoice date is required'),
    err('invDue', v.due && v.due < v.date ? 'Due date can’t be before the invoice date' : ''),
  ].every(Boolean);
  if (!ok || !v.items.length) return;
  /* someone may have billed these items meanwhile (another tab) */
  const drs = new Map(readDRs().map(d => [d.id, d]));
  const gone = v.items.filter(y => { const d = drs.get(y.dr); return !d || itemInv(d, y.idx); });
  if (gone.length) { closeModal(); rerender(); return toast(`${gone.map(y => y.mcId).join(', ')} already invoiced — please reselect`); }
  const c = invCalc(v);
  const inv = { id: 'INV-' + Date.now().toString(36).toUpperCase(), no: v.no, po: v.o.no, vendor: vendorKey, date: v.date, due: v.due || null, asn: v.asn, selfAddr: VENDOR.name,
    docs: v.docs, remarks: v.remarks,
    items: c.lines.map(y => ({ dr: y.dr, idx: y.idx, mcId: y.mcId, lineCode: y.lineCode, hsn: y.hsn, qty: y.qty, unit: y.unit, price: y.price, gst: y.gst, cess: +y.cess || 0 })),
    charges: c.ch.map(x => ({ details: x.details, type: x.type, base: x.baseN, gst: +x.gst || 0 })),
    base: c.base, igst: c.igst, cgst: c.cgst, sgst: c.sgst, cess: c.cess, chargesTotal: c.charges, amount: c.total,

function downloadItems(o) {
  const head = ['Item Code','Description','Item Ref No','Product Code','HSN','Unit Price','PO Qty','Delivered Qty','Invoice Qty','Balance GRN Qty','Base Amount','Tax Amount','Item Total Amount','Delivery Date'];
  const rows = o.lines.map(l => [l.code, l.desc, l.ref, l.productCode, l.hsn, l.price, l.qty, l.delivered, l.invoiced, r2(l.qty - l.delivered),
    lineBase(l), lineTax(l), lineTotal(l), fmtD(o.lineDate)]);
  const csv = [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
  a.download = `PO_${o.no}_order_items.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Order items for ${o.no} downloaded`);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, .nav-item, [data-nav], [data-sltog]');
  if (!t) return;
  const d = t.dataset;
  const cur = byId((location.hash.split('/')[2]) || 0);
  if (d.sltog) { const s = slOpenSet(); s.has(d.sltog) ? s.delete(d.sltog) : s.add(d.sltog); rerender(); return; }
  if (d.nav) { location.hash = `#/${d.nav}`; return; }
  if (d.ditab) { ui.diTab = d.ditab; route(); return; }
  if (d.tab) { ui.tab = d.tab; ui.status = null; if (location.hash !== '#/orders') location.hash = '#/orders'; else route(); return; }
  if (d.open) { location.hash = `#/orders/${d.open}`; return; }
  if ('back' in d) { location.hash = '#/orders'; return; }
  if (d.range) { ui.range = d.range; route(); return; }
  if (d.status) { ui.status = ui.status === d.status ? null : d.status; route(); return; }
  if (d.sort) { ui.sort = [d.sort, ui.sort[0] === d.sort ? -ui.sort[1] : 1]; route(); return; }
  if (d.goto) { document.getElementById(d.goto)?.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (d.mc && cur) { cur.lines[+d.mc].tab = 'mc'; rerender(); return; }
  if (d.ltab && cur) { const [i, k] = d.ltab.split(':'); cur.lines[+i].tab = k; rerender(); return; }
  if (d.irRedo && cur) {   // re-inspect: new IR on the clearance, pre-filled with the rejected qty
    closeModal(); irMergeModal(cur, [d.irRedo]);
    if (irDraft) { irDraft.qty[d.irRedo] = Math.min(+d.irRedoQty, mcAvail(cur, findMc(cur, d.irRedo).m)); drawIrItems(cur); }
    return; }
  if (d.grn && cur) { grnModal(cur, cur.grns[+d.grn]); return; }
  if (d.dr) { drModal(d.dr); return; }
  if (d.invNew) { const dr = myDrs().find(x => x.id === d.invNew); if (dr) openInvoicePanel(openIdx(dr).map(i => selKey(dr, i))); return; }
  if (d.diTog) { ui.diOpen.has(d.diTog) ? ui.diOpen.delete(d.diTog) : ui.diOpen.add(d.diTog); route(); return; }
  if ('diClear' in d) { ui.diSel.clear(); route(); return; }
  if ('invSel' in d) { openInvoicePanel([...ui.diSel]); return; }
  if (invDraft && document.getElementById('invPrev')) {
    if (d.invRm) { invDraft.items = invDraft.items.filter(y => y.key !== d.invRm); drawInvoice(); return; }
    if ('invAdd' in d) { invDraft.adding = true; drawInvoice(); document.getElementById('invAdd')?.focus(); return; }
    if ('invChadd' in d) { invDraft.charges.push({ details: '', type: 'Freight', base: '', gst: 18 }); drawInvoice(); return; }
    if ('invChrm' in d) { invDraft.charges.splice(+d.invChrm, 1); drawInvoice(); return; }
    if ('invGo' in d) { submitInvoicePanel(); return; }
  }
  if (d.clarSend && cur) { sendClar(cur, d.clarSend); return; }
  if (d.mcopen && cur) { const [i, k] = d.mcopen.split(':').map(Number); mcModal(cur, i, k); return; }
  if (d.irNew && cur) { if (t.disabled) return; irMergeModal(cur, [d.irNew, ...ui.irSel]); return; }
  if ('irBar' in d && cur) { irMergeModal(cur, [...ui.irSel]); return; }
  if (d.irFilter && cur) { ui.irFilter = d.irFilter; rerender(); return; }
  if (d.irOpen && cur) { irViewModal(cur, d.irOpen); return; }
  if (d.irCsv && cur) { irCsv(cur, d.irCsv); return; }
  if (d.irWd && cur) { irWithdrawModal(cur, d.irWd); return; }
  if (d.irWdOk && cur) { irWithdraw(cur, d.irWdOk); return; }
  if ('irClear' in d) { ui.irSel.clear(); rerender(); return; }
  if ('irSubmit' in d && cur && irDraft) { submitMergedIR(cur); return; }
  if (d.irrm && cur && irDraft) { irDraft.ids = irDraft.ids.filter(x => x !== d.irrm); delete irDraft.qty[d.irrm]; drawIrItems(cur); return; }
  if ('cgrn' in d) { toast('Conditional GRN is under quality inspection'); return; }
  if ('closeBtn' in d) { closeModal(); return; }
  if (d.dlItems) { downloadItems(byId(d.dlItems)); return; }
  if (d.dlPo) { toast(`PO ${byId(d.dlPo).no}.pdf downloaded`); return; }
  if ('query' in d) { toast('Query raised with the Trident buyer'); return; }
  if (d.ack) {
    const o = byId(d.ack);
    modal('Acknowledge Purchase Order', `<p style="margin:0 0 10px;font-size:12px">You are confirming acceptance of PO <b>${o.no}</b>
      for <b>INR ${fmtN(poTotal(o))}</b> (${o.lines.length} line items), deliverable to ${esc(OFFICES[o.office].name)} by ${fmtD(o.deliveryDate)}.</p>
      <p class="muted" style="margin:0;font-size:11px">Trident will be notified and the PO status will change to Open.</p>`,
      `<button class="btn btn-ghost" data-close-btn>Cancel</button><button class="btn btn-primary" data-ack-ok="${o.id}">Acknowledge</button>`);
    return;
  }
  if (d.ackOk) { const o = byId(d.ackOk); o.status = 'OPEN'; writeAck(o); closeModal(); route(); toast(`PO ${o.no} acknowledged — Trident notified`); return; }
});
document.addEventListener('input', e => {
  if (e.target.dataset?.irq && irDraft) { irDraft.qty[e.target.dataset.irq] = e.target.value; return; }
  if (invDraft && e.target.closest?.('.inv-form')) {
    const t = e.target, fld = { invNo: 'no', invDate: 'date', invDue: 'due', invRemarks: 'remarks' }[t.id];
    if (fld) { invDraft[fld] = t.value.trim(); t.classList.remove('bad'); const er = document.getElementById(t.id + 'Err'); if (er) er.hidden = true; }
    if (t.dataset.invCess) invDraft.items.find(y => y.key === t.dataset.invCess).cess = t.value;
    if (t.dataset.invCh) { const [n, k] = t.dataset.invCh.split(':'); invDraft.charges[+n][k] = t.value; }
    drawInvoice(true); return;
  }
  if (e.target.id === 'diQ') {
    ui.diQ = e.target.value; const pos = e.target.selectionStart; route();
    const q = document.getElementById('diQ'); q.focus(); q.setSelectionRange(pos, pos); return;
  }
  if (e.target.id === 'q') {
    ui.q = e.target.value; const pos = e.target.selectionStart; route();
    const q = document.getElementById('q'); q.focus(); q.setSelectionRange(pos, pos);
  }
});
document.addEventListener('change', e => {
  const ds = e.target.dataset || {};
  if (ds.diItem) { diSelect([ds.diItem], e.target.checked); return; }
  if (ds.diAll) { const d = myDrs().find(x => x.id === ds.diAll); if (d) diSelect(openIdx(d).map(i => selKey(d, i)), e.target.checked); return; }
  if (invDraft && e.target.closest?.('.inv-form')) {
    const t = e.target;
    if (t.id === 'invAsn') { invDraft.asn = t.checked; return; }
    if (t.id === 'invDocs') { invDraft.docs = [...t.files].map(f => f.name); document.getElementById('invDocNames').textContent = invDraft.docs.join(', '); return; }
    if (t.id === 'invAdd') {
      if (t.value) { const [id, i] = t.value.split('#'), dr = myDrs().find(x => x.id === id), x = dr.items[+i];
        invDraft.items.push({ key: t.value, dr: id, idx: +i, mcId: x.mcId, lineCode: x.lineCode, desc: x.lineDesc || '', hsn: hsnOf(dr.order, x),
          qty: x.qty, unit: x.unit || '', price: x.price, gst: x.gst, cess: 0, shipTo: x.shipTo, shipAddr: x.shipAddr || '' }); }
      invDraft.adding = false; drawInvoice(); return;
    }
    if (t.dataset.invCh) { const [n, k] = t.dataset.invCh.split(':'); invDraft.charges[+n][k] = t.value; }
    if (t.dataset.invCess || t.dataset.invCh) { drawInvoice(); return; }
    return;
  }
  const curPO = byId(location.hash.split('/')[2] || 0);
  if (e.target.dataset?.irsel && curPO) { e.target.checked ? ui.irSel.add(e.target.dataset.irsel) : ui.irSel.delete(e.target.dataset.irsel); rerender(); return; }
  if (e.target.dataset?.irselLine && curPO) {
    const l = curPO.lines[+e.target.dataset.irselLine];
    l.mcs.filter(m => mcAvail(curPO, m) > 0).forEach(m => e.target.checked ? ui.irSel.add(m.id) : ui.irSel.delete(m.id));
    rerender(); return;
  }
  if (e.target.id === 'irAdd' && curPO && irDraft && e.target.value) {
    const id = e.target.value; irDraft.ids.push(id); irDraft.qty[id] = mcAvail(curPO, findMc(curPO, id).m); drawIrItems(curPO); return;
  }
  if (e.target.id === 'acct') { setVendor(e.target.value); ['#/orders', '#/dispatch'].includes(location.hash) ? route() : (location.hash = '#/orders'); toast(`Logged in as ${VENDOR.name}`); return; }
  if (e.target.id === 'from' || e.target.id === 'to') {
    if (!e.target.value) return;
    const [y, m, d] = e.target.value.split('-').map(Number);
    ui[e.target.id] = new Date(y, m - 1, d); ui.range = 'custom'; route();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

route();
</script>
</body>
</html>
